name: Add new issues and PRs to DigitalTwin project

# Adds every newly opened issue and pull request in this repo to the
# org-level "DigitalTwin" project board:
# https://github.com/orgs/artpark-hub/projects/4
# This replaces GitHub's built-in auto-add, which is capped on the Free plan.

on:
  issues:
    types: [opened]
  pull_request:
    types: [opened]

jobs:
  add-to-project:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/add-to-project@v2.0.0
        with:
          project-url: https://github.com/orgs/artpark-hub/projects/4
          github-token: ${{ secrets.ADD_TO_PROJECT_PAT }}
